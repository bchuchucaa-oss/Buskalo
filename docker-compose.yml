
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nearmarket-api
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:?Debes configurar DOCKER_DATABASE_URL en .env}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Falta JWT_SECRET_KEY en .env}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    init: true
    restart: unless-stopped
